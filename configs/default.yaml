seed: 42
dataset:
  train_name: pipecat-ai/smart-turn-data-v3.2-train
  test_name: pipecat-ai/smart-turn-data-v3.2-test
  validation_fraction: 0.1667
  sample_rate: 16000
model:
  encoder: openai/whisper-tiny
  pooling: attention
  mlp_widths: [128]
  dropout: 0.1
  finetuning: frozen
training:
  batch_size: 16
  head_learning_rate: 0.001
  encoder_learning_rate: 0.00001
  max_epochs: 20
  gradient_clip_norm: 1.0
evaluation:
  threshold_candidates: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  max_false_end_rate: null
